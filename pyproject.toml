[project]
name = "parangsae-quant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nautilus_trader",
    "ccxt",
    "pydantic>=2.0",
    "pyyaml",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
